# E.1a.3 — Verify-only CI for @sammati/* SDK packages (no npm publish, no secrets).
name: SDK verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Check workspace dependency policy
        run: npm run check:workspace-deps

      - name: Typecheck SDK packages
        run: npm run typecheck:packages

      - name: release:dry-run (build, test, pack, verify tarballs)
        run: npm run release:dry-run

      - name: release:dry-run:full — install smoke (ESM/CJS from tarballs)
        run: npx tsx scripts/sdk-release/cli.ts smoke --skip-pack
