version: "3.7"

networks:
  fabric_network:
    external:
      name: fabric_network

services:

  explorerdb.mynetwork.com:
    image: ghcr.io/hyperledger-labs/explorer-db:latest
    container_name: explorerdb.mynetwork.com
    hostname: explorerdb.mynetwork.com
    environment:
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWORD=password
    healthcheck:
      test: "pg_isready -h localhost -p 5432 -q -U hppoc"
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fabric_network

  explorer.mynetwork.com:
    image: ghcr.io/hyperledger-labs/explorer:latest
    container_name: explorer.mynetwork.com
    hostname: explorer.mynetwork.com
    environment:
      - DATABASE_HOST=explorerdb.mynetwork.com
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWD=password
      - LOG_LEVEL_APP=INFO
      - LOG_LEVEL_DB=INFO
      - LOG_LEVEL_CONSOLE=INFO
      - LOG_CONSOLE_STDOUT=true
      - DISCOVERY_AS_LOCALHOST=false
    volumes:
      - ~/hyperledger/explorer/config.json:/opt/explorer/app/platform/fabric/config.json
      - ~/hyperledger/explorer/connection-profile:/opt/explorer/connection-profile
      - ~/hyperledger/mynetwork/crypto-config:/tmp/crypto
    ports:
      - "8080:8080"
    depends_on:
      explorerdb.mynetwork.com:
        condition: service_healthy
    networks:
      - fabric_network

volumes:
  pgdata:
